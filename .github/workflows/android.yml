name: Build Aqua Bond Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Build Android web assets
        run: npm run build:android
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Build APK
        run: ./gradlew assembleDebug -PversionCodeOverride=${{ github.run_number }} -PversionNameOverride=1.0.${{ github.run_number }}
        working-directory: android
      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aqua-bond-android.apk
      - name: Publish latest Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Aqua Bond Android
          body: |
            Latest installable Aqua Bond Android build.

            This APK is an automatically generated debug-signed build. Android updates must be downloaded and installed manually.
          files: aqua-bond-android.apk
          overwrite_files: true
          make_latest: true
